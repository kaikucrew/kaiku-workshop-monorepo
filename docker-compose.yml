services:
  api:
    build: ./api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - API_AUTH_KEY=${API_AUTH_KEY:-}

  ui:
    build:
      context: ./ui
      args:
        VITE_API_URL: http://localhost:3001
        VITE_AUTH_KEY: ${API_AUTH_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
